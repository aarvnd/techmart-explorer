<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechMart Product Explorer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <h1 class="logo">Tech<span>Mart</span></h1>
      <nav class="nav">
        <a href="#price-finder">Price Finder</a>
        <a href="#popular">Popular</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="price-finder" class="section">
      <h2>Smart Price Finder</h2>
      <p class="sub">Find products closest to your budget</p>

      <div class="panel">
        <div class="form-row">
          <div class="field">
            <label for="targetPrice">Find products around (₹)</label>
            <input type="number" id="targetPrice" placeholder="e.g. 70000" min="0">
          </div>
          <div class="field small">
            <label for="closestCount">Show</label>
            <select id="closestCount">
              <option value="3">3</option>
              <option value="5" selected>5</option>
              <option value="8">8</option>
            </select>
          </div>
          <button class="btn" id="searchPriceBtn">Search</button>
        </div>
        <p class="error" id="priceError"></p>
      </div>

      <div class="panel">
        <div class="form-row">
          <div class="field">
            <label for="rangeMin">Minimum price (₹)</label>
            <input type="number" id="rangeMin" placeholder="50000" min="0">
          </div>
          <div class="field">
            <label for="rangeMax">Maximum price (₹)</label>
            <input type="number" id="rangeMax" placeholder="80000" min="0">
          </div>
          <button class="btn btn-outline" id="rangeSearchBtn">Find products in this range</button>
        </div>
        <p class="error" id="rangeError"></p>
      </div>

      <h3 id="priceResultTitle" class="result-title"></h3>
      <div class="grid" id="priceResults"></div>
    </section>

    <section id="popular" class="section">
      <div class="section-head">
        <div>
          <h2>🔥 Popular Products</h2>
          <p class="sub">Ranked by rating × reviews</p>
        </div>
        <div class="field small">
          <label for="topKSelect">Show Top</label>
          <select id="topKSelect">
            <option value="3">3</option>
            <option value="5">5</option>
            <option value="10">10</option>
          </select>
        </div>
      </div>
      <div class="grid" id="popularList"></div>
    </section>

  </main>

  <div class="modal" id="productModal">
    <div class="modal-box">
      <button class="modal-close" id="modalClose">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <footer class="footer">
    <p>TechMart Product Explorer &middot; Arvind Kumar</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/features/priceFinder.js"></script>
  <script src="js/features/topK.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
